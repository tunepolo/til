baseURL = "https://tunepolo.github.io/til/"

locale = "ja-jp"
defaultContentLanguage = "ja"
title = "Today 'tunepolo' Leaned"
theme = "hugo-theme-relearn"

hasCJKLanguage = true
enableGitInfo = true

# 検索は relearn 7.0.0 以降テーマ側が自動で組み込むため
# search / searchpage を outputs に書いてはいけない
[outputs]
home = ["html", "rss"]
section = ["html", "rss"]
page = ["html"]

[params]
    # 編集リンク
    editURL = "https://github.com/tunepolo/til/edit/master/content/"

    # OGP
    images = ["images/love-to-learn.jpg"]

    # 折りたたんだ状態で左メニューを表示する
    alwaysopen = false
    collapsibleMenu = true

    # 各ページに最終更新日と Git の情報を出す
    disableToc = false

# 配色（ライト / ダーク / OS 追従）
[[params.themeVariant]]
    identifier = "auto"
    name = "Auto"
    auto = ["relearn-light", "relearn-dark"]
[[params.themeVariant]]
    identifier = "relearn-light"
    name = "Light"
[[params.themeVariant]]
    identifier = "relearn-dark"
    name = "Dark"

# Markup configure section
# See https://gohugo.io/getting-started/configuration-markup/
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark.renderer]
        unsafe = true
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false
